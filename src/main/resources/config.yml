# ==================================================================== #
#                              SunDB                                   #
#              Centralized Database Configuration Hub                  #
# ==================================================================== #

# Define your remote, shared databases here.
# plugins using SunDB can automatically connect to these without
# needing you to copy/paste credentials into every plugin's config.

global:
  # Any query taking longer than this will be logged and tracked in /sundb top
  slow-query-threshold-ms: 50

databases:

  # ------------------------------------------------------------------ #
  # The "main" database. Most plugins will default to requesting this.
  # Supported types: MYSQL, MARIADB, POSTGRESQL
  # ------------------------------------------------------------------ #
  main:
    type: MYSQL
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: root
    password: password
    pool:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
    # List of database names to use as read replicas. 
    # Optional. SELECT queries will be distributed across these.
    # readers: ["replica_1", "replica_2"]

  # ------------------------------------------------------------------ #
  # The "cache" database. Generally used for faster in-memory storage,
  # cross-server synchronization, or Pub/Sub messaging.
  # Supported types: REDIS
  # ------------------------------------------------------------------ #
  #  cache:
  #    type: REDIS
  #    host: 127.0.0.1
  #    port: 6379
  #    password: ""
  #    pool:
  #      maximum-pool-size: 8
  #      minimum-idle: 1
  #      connection-timeout: 5000

