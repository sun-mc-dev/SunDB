name: SunDB
version: '${project.version}'
api-version: 1.21
main: me.sunmc.db.SunDBPlugin
folia-supported: true
author: sun-dev
description: Lightweight async database library for Paper/Folia/Velocity.
load: STARTUP

commands:
  sundb:
    description: Core SunDB command
    aliases: [ db ]

libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.xerial:sqlite-jdbc:3.51.3.0
  - com.mysql:mysql-connector-j:9.6.0
  - io.lettuce:lettuce-core:7.5.0.RELEASE
  - org.mariadb.jdbc:mariadb-java-client:3.5.7
  - org.postgresql:postgresql:42.7.10
  - com.h2database:h2:2.4.240
  - org.mongodb:mongodb-driver-sync:5.7.0-beta1
  - io.projectreactor:reactor-core:3.8.3
  - io.projectreactor.netty:reactor-netty-core:1.3.3
  - org.reactivestreams:reactive-streams:1.0.4
  - org.apache.commons:commons-pool2:2.13.1